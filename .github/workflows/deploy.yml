name: Vercel Deploy & Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-verification:
    name: Verify Vercel Build Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix web ci --include=dev

      - name: Run Deploy Check & Build
        run: |
          npm run check:deploy
          npm --prefix web run build
          node scripts/copy-web-dist-to-public.js

      - name: Verify Live API Health (Optional Notification)
        run: |
          curl -s -f "https://enjoyfreedeals-web.vercel.app/api/health" || echo "API health check finished"
