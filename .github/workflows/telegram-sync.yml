name: Sync Telegram Loot Deals

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-deals:
    name: Scrape & Filter Telegram Deals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Genie Loot Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          GENIE_LOOT_PAGE_URLS: ${{ secrets.GENIE_LOOT_PAGE_URLS || 'https://t.me/s/India_loot_deals,https://t.me/s/king_deal_1,https://t.me/s/icoolzTricks' }}
          GENIE_LOOT_BEST_DEAL_FRACTION: ${{ secrets.GENIE_LOOT_BEST_DEAL_FRACTION || '1' }}
          GENIE_LOOT_CHEAP_PRICE_LIMIT: "999"
          GENIE_LOOT_REJECT_UNSELECTED: "false"
          GENIE_LOOT_STALE_SCAN_LIMIT: "5000"
          APP_ENV: "production"
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            npm run sync:genie-loot
          else
            echo "SUPABASE_URL secret is not configured in repository secrets. Skipping sync."
          fi
